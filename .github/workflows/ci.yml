name: pipeline CI

on:
    push:
        branches: ["dev", "addList"]
    pull_request:
        branches: ["dev", "addList"]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        
        steps:
            - name: install checkout
              uses: actions/checkout@v5
              
            - name: check docker
              run: |
                  docker -v
                  docker compose version
                  
            - name: build docker
              run: docker compose -f docker-compose.yaml build
              
            - name: composer install
              run: |
                  docker compose run --rm php_devops composer install \
                  --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
                  
            - name: run test
              run: docker compose run --rm php_devops ./vendor/bin/phpunit --testdox