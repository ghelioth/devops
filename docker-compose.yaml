services:
    db_devops:
        container_name: db_devops
        image: postgres:17-alpine3.23
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            -   './.docker/postgres/data:/var/lib/postgresql/data'
        ports:
            -   "5432:5432"
            
    php_devops:
        container_name: php_devops
        build: .docker/php
        working_dir: /www/symfony
        volumes:
            -   './symfony/:/www/symfony'
            
    server_devops:
        container_name: server_devops
        image: nginx:1.28-alpine3.21
        working_dir: /www
        volumes:
            -   './symfony/:/www/symfony'
            -  './.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            -   "8080:80"